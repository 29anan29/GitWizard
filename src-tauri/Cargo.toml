[package]
name = "gitwizard"
version = "0.3.0"
description = "Intent-driven Git workflow console"
authors = ["anan <anwang13@outlook.com>"]
edition = "2021"

[lib]
name = "gitwizard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.20", features = ["ssh", "https", "vendored-libgit2", "vendored-openssl"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
confy = "0.6"
rfd = "0.15"
ureq = { version = "2", features = ["json"] }
open = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
