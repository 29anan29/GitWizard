[package]
name = "gitwizard"
version = "0.9.0"
description = "Intent-driven Git workflow console"
authors = ["anan <anwang13@outlook.com>"]
edition = "2021"

[lib]
name = "gitwizard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.20", features = ["ssh", "https", "vendored-libgit2", "vendored-openssl"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
confy = "0.6"
rfd = "0.15"
ureq = { version = "2", features = ["json", "socks-proxy"] }
open = "5"
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service"
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
