name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            build_target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu
            build_target: aarch64-unknown-linux-gnu
            bundles: deb,rpm
            experimental: false
          - os: windows-latest
            targets: x86_64-pc-windows-msvc
            build_target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - os: windows-latest
            targets: aarch64-pc-windows-msvc
            build_target: aarch64-pc-windows-msvc
            bundles: nsis
            experimental: true
          - os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            build_target: universal-apple-darwin
            bundles: dmg

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.build_target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'GitWizard v__VERSION__'
          releaseBody: 'Cross-platform installers for GitWizard.'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.build_target }} --bundles ${{ matrix.bundles }}

      - name: Build macOS pkg
        if: runner.os == 'macOS'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP="src-tauri/target/${{ matrix.build_target }}/release/bundle/macos/GitWizard.app"
          pkgbuild --component "$APP" --identifier dev.gitwizard.app --version "$VERSION" --install-location /Applications "GitWizard-${VERSION}.pkg"

      - name: Upload macOS pkg to release
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v${VERSION}" "GitWizard-${VERSION}.pkg" --clobber

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}-${{ matrix.build_target }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/${{ matrix.build_target }}/release/bundle/**/*
