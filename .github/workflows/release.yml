name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            build_target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu
            build_target: aarch64-unknown-linux-gnu
            bundles: deb,rpm
            experimental: false
          - os: windows-latest
            targets: x86_64-pc-windows-msvc
            build_target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - os: windows-latest
            targets: aarch64-pc-windows-msvc
            build_target: aarch64-pc-windows-msvc
            bundles: nsis
            experimental: true
          - os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            build_target: universal-apple-darwin
            bundles: dmg,app

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.build_target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'GitWizard v__VERSION__'
          releaseBody: 'Cross-platform installers for GitWizard.'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.build_target }} --bundles ${{ matrix.bundles }}

      - name: Build macOS pkg
        if: runner.os == 'macOS'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP=$(find src-tauri/target/${{ matrix.build_target }}/release/bundle -type d -name "GitWizard.app" | head -1)
          if [ -z "$APP" ]; then APP=$(find src-tauri/target -type d -name "GitWizard.app" | head -1); fi
          echo "Using app bundle: $APP"
          pkgbuild --component "$APP" --identifier dev.gitwizard.app --version "$VERSION" --install-location /Applications "GitWizard-${VERSION}.pkg"

      - name: Upload macOS pkg to release
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v${VERSION}" "GitWizard-${VERSION}.pkg" --clobber

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}-${{ matrix.build_target }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/${{ matrix.build_target }}/release/bundle/**/*

  updater-json:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate latest.json and commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BASE="https://github.com/29anan29/GitWizard/releases/download/v${VERSION}"

          # Discover actual asset names from the release
          ASSETS=$(gh release view "v${VERSION}" --json assets --jq '.assets[].name')

          linux_x64=$(echo "$ASSETS" | grep -E '\.AppImage$' | head -1)
          linux_arm=$(echo "$ASSETS" | grep -E 'aarch64.*\.deb$' | head -1)
          win_x64=$(echo "$ASSETS" | grep -E '_x64-setup\.exe$' | head -1)
          win_arm=$(echo "$ASSETS" | grep -E 'aarch64.*\.exe$' | head -1)
          mac_x64=$(echo "$ASSETS" | grep -E '_x64\.dmg$' | head -1)
          mac_arm=$(echo "$ASSETS" | grep -E '_aarch64\.dmg$' | head -1)

          jq -n \
            --arg ver "$VERSION" \
            --arg date "$PUB_DATE" \
            --arg lx64 "${linux_x64:+$BASE/$linux_x64}" \
            --arg larm "${linux_arm:+$BASE/$linux_arm}" \
            --arg wx64 "${win_x64:+$BASE/$win_x64}" \
            --arg warm "${win_arm:+$BASE/$win_arm}" \
            --arg mx64 "${mac_x64:+$BASE/$mac_x64}" \
            --arg marm "${mac_arm:+$BASE/$mac_arm}" \
            '{
              version: $ver,
              notes: "GitWizard v\($ver)",
              pub_date: $date,
              platforms: (
                {} +
                (if $lx64 != "" then {"linux-x86_64": {signature: "", url: $lx64}} else {} end) +
                (if $larm != "" then {"linux-aarch64": {signature: "", url: $larm}} else {} end) +
                (if $wx64 != "" then {"windows-x86_64": {signature: "", url: $wx64}} else {} end) +
                (if $warm != "" then {"windows-aarch64": {signature: "", url: $warm}} else {} end) +
                (if $mx64 != "" then {"darwin-x86_64": {signature: "", url: $mx64}} else {} end) +
                (if $marm != "" then {"darwin-aarch64": {signature: "", url: $marm}} else {} end)
              )
            }' > latest.json

          cat latest.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git diff --cached --quiet || git commit -m "chore: update latest.json for v${VERSION}" && git push
